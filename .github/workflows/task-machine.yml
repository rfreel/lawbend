name: Bend task machine
on:
  push:
    paths: ['agent-machine/**', '.agents/tests/machine.sh', '.github/workflows/task-machine.yml', 'docs/plans/task-machine.md']
  pull_request:
    paths: ['agent-machine/**', '.agents/tests/machine.sh', '.github/workflows/task-machine.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-machine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Bend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.27/bend-2.0.27-linux-x64.tar.gz
          echo "58adc86af6605ed0c48f7d84e4c23028f78893ce4a867a20a4f004b11582687b  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend" --strip-components=1
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bend/bin/bend" version
          "$RUNNER_TEMP/bend/bin/bend" guide > "$RUNNER_TEMP/guide.md"
      - name: Check laws and actual IO protocol
        run: bash .agents/tests/machine.sh
