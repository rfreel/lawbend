name: Agent system acceptance
on:
  push:
    paths:
      - '.agents/tests/**'
      - '.agents/bin/**'
      - 'templates/bend-proof/**'
      - 'docs/plans/agent-completion.md'
      - '.github/workflows/agent-system.yml'
  pull_request:
    paths:
      - '.agents/tests/**'
      - '.agents/bin/**'
      - 'templates/bend-proof/**'
      - '.github/workflows/agent-system.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-system-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash .agents/tests/receipts.sh
  initializer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install official Bend checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.27/bend-2.0.27-linux-x64.tar.gz
          echo "58adc86af6605ed0c48f7d84e4c23028f78893ce4a867a20a4f004b11582687b  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend" --strip-components=1
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bend/bin/bend" version
          "$RUNNER_TEMP/bend/bin/bend" guide
      - run: bash .agents/tests/initializer.sh
