name: Agent system acceptance
on:
  push:
    paths: ['.agents/tests/**', '.agents/bin/**', '.agents/CLAIMS.json', 'templates/bend-proof/**', 'agent-machine/**', 'docs/plans/agent-completion.md', '.github/workflows/agent-system.yml']
  pull_request:
    paths: ['.agents/tests/**', '.agents/bin/**', '.agents/CLAIMS.json', 'templates/bend-proof/**', 'agent-machine/**', '.github/workflows/agent-system.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-system-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .agents/tests/receipts.sh
      - name: Confirm running-state regression fails on the previous implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3a17e556324dbd9279d1b26bb5000bee3da2f213
          git show 3a17e556324dbd9279d1b26bb5000bee3da2f213:.agents/bin/gate-receipt.sh > "$RUNNER_TEMP/legacy-receipt.sh"
          if GATE_RECEIPT_SOURCE="$RUNNER_TEMP/legacy-receipt.sh" bash .agents/tests/receipt-context.sh > "$RUNNER_TEMP/legacy-check.log" 2>&1; then
            cat "$RUNNER_TEMP/legacy-check.log"
            echo 'Legacy implementation unexpectedly passed the regression' >&2
            exit 1
          fi
          grep -F 'FAIL: running gate exposed an earlier receipt' "$RUNNER_TEMP/legacy-check.log"
      - run: bash .agents/tests/receipt-context.sh
  initializer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install official Bend checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.27/bend-2.0.27-linux-x64.tar.gz
          echo "58adc86af6605ed0c48f7d84e4c23028f78893ce4a867a20a4f004b11582687b  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend" --strip-components=1 2> "$RUNNER_TEMP/tar.log" || { cat "$RUNNER_TEMP/tar.log"; exit 1; }
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          echo "GATE_CONTEXT_ID=linux-x64:bend-2.0.27:58adc86af6605ed0c48f7d84e4c23028f78893ce4a867a20a4f004b11582687b:$(uname -sr)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bend/bin/bend" version
          "$RUNNER_TEMP/bend/bin/bend" guide > "$RUNNER_TEMP/guide.md"
      - name: Exercise generated consumer and record result
        shell: bash
        run: |
          .agents/bin/gate-receipt.sh run initializer.consumer build/gate-receipts/initializer.consumer.json "$($BEND version)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -- bash .agents/tests/initializer.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: initializer-receipts-and-logs
          path: build/gate-receipts/
          if-no-files-found: ignore
