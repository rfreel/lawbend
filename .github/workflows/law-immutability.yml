name: law-immutability

on:
  push:
    paths:
      - 'LAW.bend'
      - 'LAW.IMMUTABLE'
      - '.agents/CLAIMS.json'
      - '.agents/bin/gate-receipt.sh'
      - '.github/workflows/law-immutability.yml'
  pull_request:
    paths:
      - 'LAW.bend'
      - 'LAW.IMMUTABLE'
      - '.agents/CLAIMS.json'
      - '.agents/bin/gate-receipt.sh'
      - '.github/workflows/law-immutability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical LAW.bend blob
        shell: bash
        run: |
          set -euo pipefail
          expected=3931831adee1b4c9511653b01590fc55aaf632ba
          actual="$(git hash-object LAW.bend)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Parse and type-check canonical law specification
        shell: bash
        run: |
          set -euo pipefail
          set +e
          nix run github:lukasl-dev/bend.nix -- LAW.bend > bend-check.log 2>&1
          status=$?
          set -e
          cat bend-check.log
          test "$status" -ne 0
          grep -F "9 TODOs found." bend-check.log
          unexpected_errors="$(grep -E '^Error:' bend-check.log | grep -v -F 'Error: 9 TODOs found.' || true)"
          test -z "$unexpected_errors"

      - name: Emit gate receipt
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          evidence_uri="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          .agents/bin/gate-receipt.sh emit             meta-law.integrity "$RESULT"             "git hash-object LAW.bend; nix run github:lukasl-dev/bend.nix -- LAW.bend"             "nix + Bend checker"             "$evidence_uri"             build/gate-receipts/meta-law.integrity.json -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-receipt-meta-law-integrity
          path: build/gate-receipts/meta-law.integrity.json
          if-no-files-found: error
