name: law-immutability

on:
  push:
    paths:
      - 'LAW.bend'
      - 'LAW.IMMUTABLE'
      - '.github/workflows/law-immutability.yml'
  pull_request:
    paths:
      - 'LAW.bend'
      - 'LAW.IMMUTABLE'
      - '.github/workflows/law-immutability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical LAW.bend blob
        shell: bash
        run: |
          set -euo pipefail
          expected=3931831adee1b4c9511653b01590fc55aaf632ba
          actual="$(git hash-object LAW.bend)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Parse and type-check canonical law specification
        shell: bash
        run: |
          set -euo pipefail
          set +e
          nix run github:lukasl-dev/bend.nix -- LAW.bend > bend-check.log 2>&1
          status=$?
          set -e
          cat bend-check.log

          # LAW.bend is intentionally a specification with nine open laws.
          # Bend therefore exits nonzero, but it must reach the open-law report
          # rather than a syntax/type error.
          test "$status" -ne 0
          grep -F "9 TODOs found." bend-check.log

          # Newer Bend builds prefix the expected open-law report with
          # "Error:". Reject only error lines other than that known diagnostic.
          unexpected_errors="$(grep -E '^Error:' bend-check.log | grep -v -F 'Error: 9 TODOs found.' || true)"
          test -z "$unexpected_errors"
